[project]
name = "esi-link"
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#dynamic
# https://github.com/astral-sh/uv/issues/11718
# dynamic = ["version", "description"]
version = "0.3.0"
description = "A command line first interface to the Eve Online API"
readme = "README.md"
authors = [{ name = "Chad Lowe", email = "pfmsoft.dev@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "aiolimiter>=1.2.1",
    "diskcache>=5.6.3",
    "httpx2>=2.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.17.3",
    "whenever>=0.10.0",
]
# https://packaging.python.org/en/latest/specifications/license-expression/#specification
license = "MIT"
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#license-files
license-files = ["LICENSE"]


[project.scripts]
# script entry-points
# COMMAND_NAME = "PATH.TO.ENTRY.MODULE:ENTRY_FUNCTION"

esi-link = "esi_link.rewrite.cli.main_typer:app"

[project.urls]
Documentation = "https://github.com/DonalChilde/esi-link#readme"
# Documentation_rtd = "https://esi-link.readthedocs.io"
Issues = "https://github.com/DonalChilde/esi-link/issues"
Source = "https://github.com/DonalChilde/esi-link"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-cov>=6.2.1", "ruff>=0.12.11", "scriv>=1.7.0"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]

[tool.pytest.ini_options]
pythonpath = "src"
log_file = "logs/tests.log"
log_file_date_format = "%Y-%m-%dT%H:%M:%S.%f%z"
log_file_format = "%(asctime)s %(levelname)s:%(funcName)s: %(message)s [in %(pathname)s:%(lineno)d]"
log_file_level = "INFO"

[tool.coverage.run]
branch = true
parallel = true

[tool.ruff.lint]
select = ["B", "UP", "D", "DOC", "FIX", "I", "F401"]
# non-imperative-mood (D401)
ignore = ["D401", "D101"]
# extend-select = ["I"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.scriv]
#version = "literal: pyproject.toml: project.version"
version = "literal: src/PROJECT_NAME/__init__.py: __version__"
format = "md"
md_header_level = "2"
entry_title_template = "file: changelog.d/templates/entry_title_template.md.j2"
new_fragment_template = "file: changelog.d/templates/new_fragment.${config:format}.j2"
